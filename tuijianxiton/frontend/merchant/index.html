<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家聊天系统</title>
    <link rel="stylesheet" href="style.css">
    <script src="../customer/lucide.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 登录/注册界面 -->
        <div id="auth-container" class="container">
            <h1><i data-lucide="store" style="margin-right: 10px; vertical-align: middle;"></i>商家聊天系统</h1>
            
            <div class="auth-tabs">
                <button id="login-tab" class="active"><i data-lucide="log-in" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>登录</button>
                <button id="register-tab"><i data-lucide="user-plus" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" required>
                </div>
                <button id="login-btn" class="submit-btn">登录</button>
                <div id="auth-message"></div>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-username">用户名</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" required>
                </div>
                <button id="register-btn" class="submit-btn">注册</button>
                <div id="auth-message"></div>
            </div>
        </div>

        <!-- 商家主界面 -->
        <div id="merchant-container" class="container hidden">
            <div class="merchant-header">
                <h1><i data-lucide="layout-dashboard" style="margin-right: 8px; vertical-align: middle;"></i>商家聊天系统</h1>
                <button id="logout-btn"><i data-lucide="log-out" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>退出</button>
            </div>

            <div class="merchant-body">
                <!-- 侧边栏 -->
                <div class="merchant-sidebar">
                    <nav class="sidebar-nav">
                        <button id="nav-chat" class="nav-btn active"><i data-lucide="message-circle" style="width: 18px; height: 18px; margin-right: 10px;"></i><span>聊天管理</span></button>
                        <button id="nav-products" class="nav-btn"><i data-lucide="package" style="width: 18px; height: 18px; margin-right: 10px;"></i><span>商品管理</span></button>
                    </nav>
                </div>

                <!-- 主内容区 -->
                <div class="merchant-main">
                    <!-- 聊天管理界面 -->
                    <div id="chat-management" class="content-section active">
                        <div class="chat-body">
                            <!-- 聊天室列表 -->
                            <div class="chat-sidebar">
                                <div class="sidebar-header">
                                    <h2>聊天列表</h2>
                                    <button id="create-chat-btn"><i data-lucide="plus" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle;"></i>新聊天</button>
                                </div>
                                <div id="chat-rooms-list"></div>
                            </div>

                            <!-- 创建聊天模态框 -->
                            <div id="create-chat-modal" class="modal hidden">
                                <div class="modal-content">
                                    <span class="close"><i data-lucide="x"></i></span>
                                    <h2><i data-lucide="user-plus" style="margin-right: 10px; vertical-align: middle;"></i>创建新聊天</h2>
                                    <div class="form-group">
                                        <label for="customer-username">客户用户名</label>
                                        <input type="text" id="customer-username" placeholder="请输入客户用户名" required>
                                    </div>
                                    <div class="modal-actions">
                                        <button id="cancel-create-chat">取消</button>
                                        <button id="confirm-create-chat">确定</button>
                                    </div>
                                </div>
                            </div>

                            <!-- 聊天窗口 -->
                            <div class="chat-main">
                                <div id="chat-empty" class="empty-state">
                                    <i data-lucide="messages-square" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.2;"></i>
                                    <p>请选择一个聊天室开始聊天</p>
                                </div>

                                <div id="chat-window" class="hidden">
                                    <div class="chat-header-info">
                                        <i data-lucide="user" style="width: 20px; height: 20px; margin-right: 12px; color: var(--color-accent);"></i>
                                        <h2 id="chat-room-title">客户名称</h2>
                                    </div>

                                    <div id="messages-container" class="messages-container"></div>

                                    <div class="message-input-container">
                                        <input type="text" id="message-input" placeholder="输入消息...">
                                        <div class="message-actions">
                                            <button id="select-product-btn"><i data-lucide="package" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>选择商品</button>
                                            <button id="send-message-btn"><i data-lucide="send" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>发送</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 商品管理界面 -->
                    <div id="product-management" class="content-section">
                        <div class="products-header">
                            <h2><i data-lucide="package" style="margin-right: 10px; vertical-align: middle;"></i>商品管理</h2>
                            <button id="add-product-btn"><i data-lucide="plus" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>添加商品</button>
                        </div>

                        <div id="products-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品选择模态框 -->
        <div id="product-select-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close"><i data-lucide="x"></i></span>
                <h2>选择商品</h2>
                <div id="selectable-products"></div>
                <div class="modal-actions">
                    <button id="cancel-select-product">取消</button>
                    <button id="send-product-btn">发送商品</button>
                </div>
            </div>
        </div>

        <!-- 商品详情模态框 -->
        <div id="product-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close"><i data-lucide="x"></i></span>
                <h2>商品详情</h2>
                <div id="product-details"></div>
            </div>
        </div>

        <!-- 添加/编辑商品模态框 -->
        <div id="add-product-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close"><i data-lucide="x"></i></span>
                <h2 id="modal-title">添加商品</h2>
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    <div class="form-group">
                        <label for="product-name">商品名称</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group">
                        <label for="product-description">商品描述</label>
                        <textarea id="product-description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-price">商品价格</label>
                        <input type="number" id="product-price" step="0.01" min="0" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="cancel-product">取消</button>
                        <button type="submit" id="save-product">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();
        
        // 由于界面内容是动态生成的，我们需要在 DOM 变化时重新初始化图标
        const observer = new MutationObserver(() => {
            lucide.createIcons();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
